name: Scoring weekly

# 週次。月曜に前向き宣言を作成、日曜に実現値と照合して採点。結果は agentId に紐づけて data/scoring/ にコミット。
on:
  schedule:
    - cron: "0 1 * * 1" # 月 01:00 UTC: 宣言
    - cron: "30 1 * * 0" # 日 01:30 UTC: 採点
  workflow_dispatch:
    inputs:
      mode:
        description: "declare または grade"
        required: true
        default: "grade"

permissions:
  contents: write

concurrency:
  group: odo-branch-write
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Determine mode
        id: mode
        run: |
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 1 * * 1" ]; then
            echo "mode=declare" >> "$GITHUB_OUTPUT"
          else
            echo "mode=grade" >> "$GITHUB_OUTPUT"
          fi
      - name: Run scoring
        env:
          ODO_AGENT_ID: ${{ vars.ODO_AGENT_ID }}
        run: npm run score:${{ steps.mode.outputs.mode }}
      - name: Commit data
        env:
          # Vercel Deploy Hook URL(未設定ならスキップ)。データ更新のpush後に再デプロイして最新データを配る。
          # 注: コミットメッセージに [skip ci] は付けない(付けると再デプロイが黙って止まる)。
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="${{ github.ref_name }}"
          git add data
          if git diff --staged --quiet; then
            echo "no data changes, skip commit"
            exit 0
          fi
          git commit -m "chore(scoring): ${{ steps.mode.outputs.mode }} $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$BRANCH" && git push origin "$BRANCH"; then
              echo "pushed on attempt $i"
              if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
                curl -sS -X POST "$VERCEL_DEPLOY_HOOK_URL" >/dev/null && echo "vercel redeploy triggered" || echo "vercel hook failed (non-fatal)"
              else
                echo "no VERCEL_DEPLOY_HOOK_URL secret; skip redeploy"
              fi
              exit 0
            fi
            echo "push attempt $i failed, retrying..."
            sleep $((RANDOM % 5 + 1))
          done
          echo "push failed after 5 attempts" >&2
          exit 1
