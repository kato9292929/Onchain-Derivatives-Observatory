name: OFN daily collect

# 日次cron。GitHub Actionsのランナーから各会場の公開APIを叩き、観測を data/ofn/ にコミットする。
# 注: スケジュールトリガはデフォルトブランチでのみ発火する(GitHub仕様)。検証用に workflow_dispatch も用意。

on:
  schedule:
    - cron: "10 0 * * *" # 毎日 00:10 UTC
  workflow_dispatch:
    inputs:
      offline:
        description: "fixtureで実行(true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: odo-branch-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Collect OFN
        run: |
          if [ "${{ github.event.inputs.offline }}" = "true" ]; then
            npm run ofn:collect -- --offline
          else
            npm run ofn:collect
          fi
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="${{ github.ref_name }}"
          git add data
          if git diff --staged --quiet; then
            echo "no data changes, skip commit"
            exit 0
          fi
          git commit -m "chore(ofn): daily funding/basis observation $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$BRANCH" && git push origin "$BRANCH"; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push attempt $i failed, retrying..."
            sleep $((RANDOM % 5 + 1))
          done
          echo "push failed after 5 attempts" >&2
          exit 1
